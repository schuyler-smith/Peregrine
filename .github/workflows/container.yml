# Builds the Peregrine container and publishes it to GitHub Container Registry:
#   ghcr.io/<owner>/peregrine:latest   (every push to main)
#   ghcr.io/<owner>/peregrine:1.2.3    (when you push a tag like v1.2.3)
#   ghcr.io/<owner>/peregrine:sha-...  (every build, to pin an exact version)
# Pull requests are built to check they work, but not published.
name: Container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the Python and JavaScript compile
        run: |
          python3 -m py_compile server.py mock_ebird.py
          node --check web/app.js

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image names and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/peregrine
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=ref,event=pr

      - name: Build (amd64 + arm64) and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/peregrine:sha-${GITHUB_SHA::7}"
          docker run -d --name smoke -p 8765:8765 "$IMAGE"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8765/ || true)
            [ "$code" = "200" ] && break; sleep 1
          done
          docker logs smoke
          test "$code" = "200"
          curl -sf http://localhost:8765/api/settings
